<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Frapp & Capp</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --orange:#EA7424;
    --cream:#FBF0DA;
    --espresso:#33210F;
    --mocha:#9C7B4F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--cream);
    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--espresso);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  a{color:inherit}
  .mark{font-family:'Outfit',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.01em;margin-bottom:40px;display:flex;align-items:center;gap:8px;text-decoration:none}
  .mark span{color:var(--orange)}
  h1{font-family:'Outfit',sans-serif;font-weight:800;font-size:clamp(48px,10vw,88px);letter-spacing:-0.02em;color:var(--orange);line-height:1}
  h2{font-family:'Outfit',sans-serif;font-weight:800;font-size:clamp(22px,4vw,28px);margin:12px 0 12px}
  p{max-width:420px;color:var(--mocha);font-size:16px;line-height:1.6;margin-bottom:32px}
  .links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  a.btn{
    text-decoration:none;font-weight:700;font-size:15px;
    padding:12px 24px;border-radius:999px;
  }
  a.btn-primary{background:var(--orange);color:#fff}
  a.btn-secondary{background:transparent;color:var(--espresso);border:1.5px solid #33210F33}
</style>
</head>
<body>
  <a class="mark" href="index.html"><img src="logo-mark.png" alt="" width="28" height="28">Frapp <span>&amp;</span> Capp</a>
  <h1>404</h1>
  <h2>Page not found</h2>
  <p>The page you're looking for doesn't exist or may have moved.</p>
  <div class="links">
    <a class="btn btn-primary" href="index.html">Back to Home</a>
    <a class="btn btn-secondary" href="menu.html">View Menu</a>
    <a class="btn btn-secondary" href="visit.html">Find Us</a>
  </div>
</body>
</html>
